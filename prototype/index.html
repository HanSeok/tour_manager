<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>여행 대시보드</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --paper: #f7f3ea; --card: #fffdf8; --ink: #1d2a2e; --muted: #6b7a7d; --line: #e6dfd0;
  --sea: #0f7c84; --sea-soft: #d6eeee; --coral: #e2574c; --coral-soft: #fbe2df;
  --sun: #e8a33d; --sun-soft: #fbefd9; --leaf: #3f8a5a;
  --c-관광: #0f7c84; --c-식당: #e2574c; --c-쇼핑: #8a5cc4; --c-숙소: #1d2a2e; --c-교통: #7a8a8c;
  --radius: 14px; --shadow: 0 1px 0 rgba(29,42,46,.04), 0 6px 20px -8px rgba(29,42,46,.18);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: Pretendard, system-ui, sans-serif; background: var(--paper); color: var(--ink); font-size: 15px; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }

header { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--card); }
header h1 { font-size: 18px; margin: 0; letter-spacing: -.02em; }
header h1 small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.dday:empty { display: none; }
.dday { white-space: nowrap; background: var(--coral); color: #fff; font-weight: 800; padding: 4px 10px; border-radius: 999px; font-size: 13px; }
.spent { margin-left: auto; white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.spent b { font-size: 18px; } .spent small { display: block; color: var(--muted); font-size: 12px; }
.mock { background: var(--sun-soft); color: #8a5a10; font-size: 12px; padding: 6px 18px; border-bottom: 1px solid var(--line); }

.layout { display: grid; grid-template-columns: 1fr 460px; height: calc(100dvh - 92px); }
body:has(.ro-note:not([hidden])) .layout { height: calc(100dvh - 122px); }
#map { height: 100%; }
.panel { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: var(--paper); }
.tabs { display: flex; gap: 4px; padding: 10px 12px 0; background: var(--card); border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; background: none; padding: 10px 0 12px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--sea); }
.tab { overflow-y: auto; padding: 14px 14px 40px; flex: 1; }
.tab[hidden] { display: none; }

.dates { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.dates button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 6px 12px; text-align: center; line-height: 1.25; }
.dates button small { display: block; font-size: 11px; color: var(--muted); }
.dates button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.dates button[aria-pressed="true"] small { color: #c9d3d4; }

h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 2px 8px; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 11px 5px 9px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; transition: transform .12s, background .12s; }
.chip:hover { transform: translateY(-1px); background: #fff; }
.chip:active { transform: translateY(0); }
.setup { max-width: 640px; margin: 40px auto; padding: 24px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); line-height: 1.6; }
.chips.pick { max-height: 240px; overflow-y: auto; padding: 2px; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.chip.in { opacity: .45; }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline::before { content: ""; position: absolute; left: 15px; top: 16px; bottom: 16px; width: 2px; background: repeating-linear-gradient(var(--line) 0 6px, transparent 6px 10px); }
.node { position: relative; display: grid; grid-template-columns: 32px 1fr; gap: 10px; margin-bottom: 10px; }
.num { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; background: var(--ink); color: #fff; z-index: 1; box-shadow: 0 0 0 4px var(--paper); }
.num.start { background: var(--sea); }
.card { min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; box-shadow: var(--shadow); }
.card.warn-CLOSED { border-color: var(--coral); background: var(--coral-soft); }
.card.warn-SHORT { border-color: var(--sun); }
.drive { font-size: 12.5px; color: var(--sea); font-weight: 600; margin: -2px 0 8px 42px; }
.drive a { color: inherit; text-decoration: none; }
.drive .ext { font-size: 11px; font-weight: 500; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; margin-left: 4px; }
.drive a:hover .ext { color: var(--sea); border-color: var(--sea); }
.row { display: flex; align-items: center; gap: 8px; }
.row b { font-size: 15px; }
.ctrl { margin-left: auto; display: flex; gap: 2px; }
.ctrl button { border: 0; background: none; width: 28px; height: 28px; border-radius: 8px; color: var(--muted); }
.ctrl button:hover { background: var(--paper); color: var(--ink); }
.times { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; font-variant-numeric: tabular-nums; }
.times div { background: var(--paper); border-radius: 10px; padding: 6px 8px; }
.times small { display: block; font-size: 11px; color: var(--muted); }
.times b { font-size: 15px; }
.avail b { color: var(--leaf); }
.meta { font-size: 12.5px; color: var(--muted); margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.meta input { width: 56px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 8px; background: #fff; text-align: right; }
.badge { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.badge.CLOSED { background: var(--coral); color: #fff; }
.badge.SHORT { background: var(--sun-soft); color: #8a5a10; }
.badge.NO_HOURS { background: #eceae4; color: var(--muted); }
.badge.WAIT { background: var(--sea-soft); color: var(--sea); }
.summary { display: flex; justify-content: space-between; background: var(--ink); color: #fff; border-radius: var(--radius); padding: 12px 14px; font-variant-numeric: tabular-nums; }
.summary small { display: block; color: #a9b6b8; font-size: 11.5px; }
.empty { color: var(--muted); font-size: 13.5px; padding: 16px; text-align: center; border: 1.5px dashed var(--line); border-radius: var(--radius); }
.start-place { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px; background: #fff; font-weight: 700; }
.start-time { border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px; background: #fff; }

/* expenses */
.quick { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); }
.amount { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--ink); padding-bottom: 4px; }
.amount span { font-size: 26px; font-weight: 800; color: var(--muted); }
.amount input { border: 0; outline: 0; background: none; font-size: 32px; font-weight: 800; width: 100%; font-variant-numeric: tabular-nums; }
.amount em { font-style: normal; color: var(--muted); font-size: 13px; white-space: nowrap; }
.quick .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.quick input[type=text], .quick select { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #fff; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: #fff; padding: 8px 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.submit { width: 100%; margin-top: 12px; border: 0; background: var(--coral); color: #fff; font-weight: 800; padding: 12px; border-radius: 12px; font-size: 16px; transition: filter .12s; }
.submit:hover { filter: brightness(1.06); }
.err { color: var(--coral); font-size: 13px; min-height: 18px; margin-top: 6px; }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 52px 1fr 86px; gap: 8px; align-items: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.bar i { display: block; height: 10px; border-radius: 6px; background: var(--sea); min-width: 2px; }
.bar span:last-child { text-align: right; }
.ledger { list-style: none; padding: 0; margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
.ledger li { display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--line); font-size: 14px; }
.ledger li:first-child { border-top: 0; }
.ledger .day { background: var(--paper); font-weight: 700; font-size: 12.5px; color: var(--muted); grid-template-columns: 1fr auto; }
.tag { font-size: 11.5px; padding: 2px 7px; border-radius: 6px; background: var(--sea-soft); color: var(--sea); font-weight: 700; }
.ledger small { color: var(--muted); display: block; font-size: 12px; }
.ledger .amt { font-weight: 700; font-variant-numeric: tabular-nums; }

/* schedule */
.daycard { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; box-shadow: var(--shadow); }
.daycard header { padding: 10px 14px; border: 0; background: var(--sea); color: #fff; }
.daycard header b { font-size: 16px; }
.daycard ul { list-style: none; margin: 0; padding: 6px 14px; }
.daycard li { display: grid; grid-template-columns: 50px 22px 1fr; gap: 6px; padding: 6px 0; font-size: 14px; font-variant-numeric: tabular-nums; }
.daycard li time { color: var(--muted); }
.daycard li > span { min-width: 0; }
.daycard footer { padding: 8px 14px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
.link { border: 0; background: var(--sea-soft); color: var(--sea); font-weight: 700; padding: 6px 12px; border-radius: 999px; }

.pin { width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); display: grid; place-items: center; }
.pin span { transform: rotate(45deg); color: #fff; font-weight: 800; font-size: 12px; }
.leaflet-popup-content { font-family: Pretendard, sans-serif; margin: 12px 14px; }
.pop b { font-size: 15px; } .pop p { margin: 4px 0 8px; color: var(--muted); }
.pop a { color: var(--sea); font-weight: 700; margin-left: 8px; }
.pop button { border: 0; background: var(--ink); color: #fff; padding: 6px 12px; border-radius: 8px; font-weight: 700; }

/* calendar-linked */
.num.fixed { background: var(--sun); font-size: 15px; }
.card.fixed { border-style: dashed; background: #fffaf0; }
.card.warn-LATE { border: 1.5px solid var(--coral); background: var(--coral-soft); }
.cal { font-size: 11px; font-weight: 700; color: #8a5a10; background: var(--sun-soft); padding: 1px 7px; border-radius: 6px; }
.badge.OK { background: #e3f1e7; color: var(--leaf); }
.mini { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 2px 8px; font-size: 12px; margin-left: 6px; }
.cal-btn { background: var(--sea); margin-top: 10px; }
.regnote { text-align: center; font-size: 12px; color: var(--muted); margin: 4px 0 0; }
.synced { margin-top: 10px; text-align: center; padding: 10px; border-radius: 12px; background: #e3f1e7; color: var(--leaf); font-weight: 700; }
.ev-place { display: block; margin-top: 4px; width: 100%; font-size: 12.5px; border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px; background: #fff; color: var(--muted); }
.ev-place.unlinked { border-color: var(--coral); color: var(--coral); background: var(--coral-soft); }
.daycard li.mine { color: var(--sea); }
.daycard li.pending { color: var(--muted); font-style: italic; border-top: 1px dashed var(--line); }
.st-synced { color: var(--leaf); font-weight: 700; } .st-changed, .st-none { color: #8a5a10; font-weight: 700; }

/* v2: read-only links, errors, settlement, self-check */
body.readonly .edit-only, body.readonly .ctrl, body.readonly .meta label { display: none !important; }
body.readonly .start-place, body.readonly .start-time, body.readonly .ev-place { pointer-events: none; opacity: .7; }
.ro-note { background: var(--sea-soft); color: var(--sea); font-size: 12.5px; font-weight: 700; padding: 6px 18px; border-bottom: 1px solid var(--line); }
.ro-note[hidden] { display: none; }
#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 1000; display: grid; gap: 6px; width: min(560px, calc(100vw - 32px)); }
.toast-item { display: flex; gap: 10px; align-items: flex-start; background: var(--ink); color: #fff; border-left: 4px solid var(--coral); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; box-shadow: var(--shadow); }
.toast-item span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.toast-item button { border: 0; background: none; color: #c9d3d4; font-size: 15px; }
.settle { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); font-variant-numeric: tabular-nums; }
.settle li { display: grid; grid-template-columns: 1fr auto 96px; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 14px; }
.settle li:first-child { border-top: 0; }
.settle li span:last-child { text-align: right; }
.settle .plus { color: var(--leaf); font-weight: 700; } .settle .minus { color: var(--coral); font-weight: 700; }
.settle .move { grid-template-columns: 1fr auto; background: var(--sun-soft); font-weight: 600; }
.settle .move small { color: var(--muted); font-weight: 500; }
.checks { list-style: none; padding: 0; margin: 8px 0; }
.checks li { display: grid; grid-template-columns: 24px 110px 1fr; gap: 6px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13.5px; text-align: left; }
.checks small { color: var(--muted); }
.footnote { color: var(--muted); font-size: 12.5px; text-align: center; }
.editbar { display: flex; justify-content: space-between; align-items: center; background: var(--sun-soft); color: #8a5a10; font-weight: 700; font-size: 13px; padding: 6px 10px; border-radius: 10px; margin-bottom: 10px; }
.exp-item { border: 0; background: none; padding: 0; text-align: left; min-width: 0; }
.exp-item:hover:not(:disabled) { color: var(--sea); }
.ledger li.editing { background: var(--sun-soft); }
.ledger .amt small { display: block; text-align: right; font-weight: 500; }
.wait { color: #8a5a10; }
.row .seg { flex: 1; }
.mock a { color: var(--sea); font-weight: 700; }

@media (max-width: 820px) {
  .layout { display: block; height: auto; }
  #map { height: 42vh; position: sticky; top: 0; z-index: 0; }
  .panel { border-left: 0; position: relative; z-index: 1; border-radius: 18px 18px 0 0; margin-top: -16px; box-shadow: 0 -6px 20px -10px rgba(0,0,0,.25); }
  .tabs { position: sticky; top: 0; z-index: 2; border-radius: 18px 18px 0 0; }
  .tab { overflow: visible; }
  header { padding: 10px 16px; } .mock { padding: 6px 16px; }
  header h1 small { display: none; } #spentKrw { font-size: 11px; }
}
</style>
</head>
<body>
<header>
  <h1 id="tripTitle">여행 대시보드</h1>
  <span class="dday" id="dday"></span>
  <div class="spent"><b id="spentJpy"></b><small id="spentKrw"></small></div>
</header>
<div class="mock">불러오는 중…</div>
<div class="ro-note" id="roNote" hidden></div>
<div id="toast" aria-live="polite"></div>
<main class="layout">
  <div id="map" aria-label="장소 지도"></div>
  <section class="panel">
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="route">동선</button>
      <button role="tab" data-tab="money">지출</button>
      <button role="tab" data-tab="plan">일정</button>
    </nav>
    <div class="tab" id="tab-route"></div>
    <div class="tab" id="tab-money"></div>
    <div class="tab" id="tab-plan"></div>
  </section>
</main>
<script>
// Show load/runtime errors in the banner (Apps Script has no visible console for the user).
window.addEventListener('error', (e) => {
  const el = document.querySelector('.mock');
  if (el) el.textContent = `화면 오류: ${e.message} (${String(e.filename || '').split('/').pop()}:${e.lineno})`;
});
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="route.js"></script>
<script src="schedule.js"></script>
<script src="hours.js"></script>
<script src="data.js"></script>
<script src="remote.js"></script>
<script src="settle.js"></script>
<script src="money.js"></script>
<script src="app.js"></script>
</body>
</html>
